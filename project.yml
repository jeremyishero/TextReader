name: TextReader
options:
  bundleIdPrefix: com.example.textreader
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  CoreLogic:
    path: Packages/CoreLogic
  SherpaCAPI:
    path: Packages/SherpaCAPI
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  TextReader:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - Packages
          - .github
          - .git
          - Vendor
          - diag
          - "*.xcframework.zip"
          - README.md
          - Info.plist
          - Scripts
      # 内置语音包（随版本分发，无需用户导入）：folder reference 保持目录结构
      - path: BundledVoicePacks
        type: folder
        buildPhase: resources
    dependencies:
      - package: CoreLogic
      - package: ZIPFoundation
      - package: SherpaCAPI
      - framework: Vendor/SherpaOnnxIOS.xcframework
        embed: false
      - framework: Vendor/OnnxruntimeIOS.xcframework
        embed: false
    infoPlist:
      path: Info.plist
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        # 侧载兼容：静态链接 Swift 标准库+运行库，产物不依赖手机系统的 Swift dylib（低版本 iOS 秒闪退）
        SWIFT_STATIC_STDLIB: "YES"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
        EMBEDDED_CONTENT_CONTAINS_SWIFT: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # sherpa-onnx / onnxruntime 静态库需要 libc++；zlib 兜底
        OTHER_LDFLAGS: "$(inherited) -lc++ -lz"
