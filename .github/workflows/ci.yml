name: iOS Build and CoreLogic Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Download sherpa-onnx XCFrameworks (offline TTS)
        run: |
          DL=$RUNNER_TEMP
          mkdir -p Vendor
          # 官方配对组合：sherpa-onnx v1.13.8 static + onnxruntime-libs v1.28.2 static
          curl -sL --fail -o $DL/sherpa_ios.zip \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v1.13.8-ios-static.xcframework.zip
          curl -sL --fail -o $DL/sherpa_macos.zip \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v1.13.8-macos-static.xcframework.zip
          curl -sL --fail -o $DL/ort_ios.zip \
            https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.28.2/onnxruntime-ios-static-xcframework-1.28.2.xcframework.zip
          curl -sL --fail -o $DL/ort_macos.zip \
            https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.28.2/onnxruntime-macos-static-xcframework-1.28.2.xcframework.zip
          rm -rf Vendor/x1 Vendor/x2 Vendor/x3 Vendor/x4
          unzip -q -o $DL/sherpa_ios.zip -d Vendor/x1
          unzip -q -o $DL/sherpa_macos.zip -d Vendor/x2
          unzip -q -o $DL/ort_ios.zip -d Vendor/x3
          unzip -q -o $DL/ort_macos.zip -d Vendor/x4
          mv "$(find Vendor/x1 -maxdepth 3 -type d -name '*.xcframework' | head -1)" Vendor/SherpaOnnxIOS.xcframework
          mv "$(find Vendor/x2 -maxdepth 3 -type d -name '*.xcframework' | head -1)" Vendor/SherpaOnnxMacOS.xcframework
          mv "$(find Vendor/x3 -maxdepth 3 -type d -name '*.xcframework' | head -1)" Vendor/OnnxruntimeIOS.xcframework
          mv "$(find Vendor/x4 -maxdepth 3 -type d -name '*.xcframework' | head -1)" Vendor/OnnxruntimeMacOS.xcframework
          # onnxruntime 仅作链接库：剥 Headers/Modules，避免 module.modulemap 冲突
          for plat in Vendor/OnnxruntimeIOS.xcframework/*/ Vendor/OnnxruntimeMacOS.xcframework/*/; do
            rm -rf "$plat/Headers" "$plat/Modules"
          done
          for i in 0 1 2 3; do
            plutil -remove "AvailableLibraries.$i.HeadersPath" Vendor/OnnxruntimeIOS.xcframework/Info.plist 2>/dev/null || true
            plutil -remove "AvailableLibraries.$i.ModulesPath" Vendor/OnnxruntimeIOS.xcframework/Info.plist 2>/dev/null || true
          done
          echo "--- Vendor:"
          ls Vendor
          ls Vendor/SherpaOnnxIOS.xcframework

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Prepare bundled voice packs (int8 quantized)
        run: |
          pip3 install --quiet onnxruntime onnx
          python3 Scripts/prepare_bundled_packs.py
          du -sh BundledVoicePacks

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme TextReader \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: CoreLogic unit tests
        run: |
          cd Packages/CoreLogic
          swift test

      - name: Build unsigned device IPA (for Sideloadly/AltStore)
        run: |
          xcodebuild build \
            -scheme TextReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r build_device/Build/Products/Release-iphoneos/TextReader.app Payload/
          zip -qry TextReader-unsigned.ipa Payload
          ls -la TextReader-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextReader-unsigned-ipa
          path: TextReader-unsigned.ipa
          retention-days: 30
