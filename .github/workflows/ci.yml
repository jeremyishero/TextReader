name: iOS Build and CoreLogic Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Download sherpa-onnx XCFrameworks (offline TTS)
        run: |
          mkdir -p Vendor
          curl -L --fail -o sherpa.xcframework.zip \
            https://github.com/willwade/sherpa-onnx-spm/releases/download/1.13.8/sherpa-onnx.xcframework.zip
          curl -L --fail -o ort.xcframework.zip \
            https://github.com/willwade/sherpa-onnx-spm/releases/download/1.13.8/onnxruntime.xcframework.zip
          unzip -q -o sherpa.xcframework.zip -d Vendor
          unzip -q -o ort.xcframework.zip -d Vendor
          echo "--- before normalize:"
          find Vendor -maxdepth 2 -type d || true
          # 归一化：无论 zip 内层级如何，把 *.xcframework 提到 Vendor 根
          find Vendor -type d -name "*.xcframework" | while read -r xcf; do
            base=$(basename "$xcf")
            if [ "$xcf" != "Vendor/$base" ]; then
              rm -rf "Vendor/$base"
              mv "$xcf" "Vendor/$base"
            fi
          done
          echo "--- after normalize:"
          ls Vendor
          echo "--- module maps:"
          find Vendor -name "module.modulemap" -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
          echo "--- headers layout:"
          find Vendor/sherpa-onnx.xcframework/ios-arm64 -maxdepth 3 | head -30 || true
          # onnxruntime 仅作链接库：去掉其 Headers/Modules，避免两个 module.modulemap 冲突
          for plat in Vendor/onnxruntime.xcframework/*/; do
            rm -rf "$plat/Headers" "$plat/Modules"
          done
          for i in 0 1 2 3; do
            plutil -remove "AvailableLibraries.$i.HeadersPath" Vendor/onnxruntime.xcframework/Info.plist 2>/dev/null || true
            plutil -remove "AvailableLibraries.$i.ModulesPath" Vendor/onnxruntime.xcframework/Info.plist 2>/dev/null || true
          done

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme TextReader \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: CoreLogic unit tests
        run: |
          cd Packages/CoreLogic
          swift test

      - name: Build unsigned device IPA (for Sideloadly/AltStore)
        run: |
          xcodebuild build \
            -scheme TextReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r build_device/Build/Products/Release-iphoneos/TextReader.app Payload/
          zip -qry TextReader-unsigned.ipa Payload
          ls -la TextReader-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextReader-unsigned-ipa
          path: TextReader-unsigned.ipa
          retention-days: 30
